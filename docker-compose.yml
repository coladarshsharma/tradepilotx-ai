services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradepilotx
      POSTGRES_USER: tradepilotx
      POSTGRES_PASSWORD: tradepilotx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradepilotx -d tradepilotx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
